{% extends 'admin/base.html' %}
{% block title %}Orders{% endblock %}
{% block heading %}Orders{% endblock %}
{% block top_actions %}
<select id="order-status-filter" class="select-dark">
  <option value="">All statuses</option>
</select>
<select id="order-store-filter" class="select-dark"></select>
{% endblock %}
{% block content %}
<section class="panel">
  <div id="focus-bar" class="focus-bar hidden"></div>
  <div class="table-wrap">
    <table class="data-table" id="orders-table">
      <thead>
        <tr>
          <th>Order</th><th>Date</th><th>Customer</th><th>Store</th><th>Mode</th><th>Items</th><th>Total</th><th>Status</th><th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="pager" id="orders-pager"></div>
</section>

<dialog id="order-modal" class="modal">
  <div class="modal-card wide">
    <h2>Edit Order Details</h2>
    <input type="hidden" id="order-edit-id" />
    <div class="form-grid">
      <div class="field"><label>Customer Name</label><input id="order-edit-customer" /></div>
      <div class="field"><label>Phone</label><input id="order-edit-phone" /></div>
      <div class="field"><label>Status</label>
        <select id="order-edit-status"></select>
      </div>
      <div class="field"><label>Payment Method</label><select id="order-edit-payment">
        <option value="cod">Cash on Delivery</option><option value="cash">Cash</option>
        <option value="card">Card</option><option value="upi">UPI</option>
      </select></div>
      <div class="field full"><label>Delivery Address / Pickup Details</label><textarea id="order-edit-address" rows="2"></textarea></div>
      <div class="field"><label>Discount (₹)</label><input id="order-edit-discount" type="number" min="0" step="0.01" /></div>
      <div class="field"><label>Delivery Fee (₹)</label><input id="order-edit-delivery" type="number" min="0" step="0.01" /></div>
      <div class="field full">
        <label>Order Items</label>
        <div id="order-items-editor" class="order-items-editor"></div>
        <div class="order-add-item">
          <select id="order-add-product"></select>
          <select id="order-add-variant"></select>
          <button type="button" class="btn btn-outline btn-sm" id="order-add-item">+ Add Item</button>
        </div>
      </div>
      <div class="field full"><label>Notes</label><textarea id="order-edit-notes" rows="3"></textarea></div>
      <div class="field full"><div id="order-edit-summary" class="muted"></div></div>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-danger" id="order-delete">Delete Order</button>
      <a class="btn btn-outline btn-sm" id="order-invoice-link" href="#" target="_blank">Download Invoice</a>
      <button type="button" class="btn btn-outline" id="order-cancel">Cancel</button>
      <button type="button" class="btn btn-dark" id="order-save">Save Changes</button>
    </div>
  </div>
</dialog>
{% endblock %}
{% block scripts %}<script>AdminOrders.init();</script>{% endblock %}
