[project]
name = "fishandmeat"
version = "1.0.0"
description = "Fish and Meat storefront and admin portal"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.0.0",
  "Werkzeug>=3.0.0",
  "pymongo>=4.6.0",
  "python-dotenv>=1.0.0",
  "openpyxl>=3.1.0",
  "reportlab>=4.0.0",
  "Pillow>=10.0.0",
  "Waitress>=3.0.0",
]

[tool.vercel]
# module:object — Flask app instance in app.py
entrypoint = "app:app"