# Example nginx site for Fish and Meat (gunicorn on 127.0.0.1:8000)
#
# 1) pip install -r requirements.txt
# 2) set FAM_ENV=production, SECRET_KEY, MONGO_URI (or mongo.env), FAM_BEHIND_PROXY=1
# 3) gunicorn -c gunicorn.conf.py "app:app"
# 4) point this server block at your domain and reload nginx
#
# sudo ln -s /path/to/this/file /etc/nginx/sites-enabled/fishandmeat
# sudo nginx -t && sudo systemctl reload nginx

upstream fishandmeat_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name your-domain.com;
    # return 301 https://$host$request_uri;   # enable after certbot

    client_max_body_size 20M;

    location / {
        proxy_pass http://fishandmeat_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
    }

    # Optional: serve static assets directly from disk (faster than Flask)
    # location /assets/ {
    #     alias /var/www/fishandmeat/assets/;
    #     expires 7d;
    #     add_header Cache-Control "public";
    # }
}
